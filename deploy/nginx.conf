server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Revalidate HTML and health responses after each deployment.
    add_header Cache-Control "no-cache" always;

    location = /health.json {
        try_files $uri =404;
    }

    # Serve Expo's generated route HTML, including /auth callbacks.
    # Missing assets/routes must return 404 instead of the application shell.
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    location ~ /\. {
        deny all;
    }
}
